<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabMitra - Razorpay Test</title>
    <!-- Load Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; max-width: 600px; margin: auto; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; background: #f9f9f9; }
        input, button, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #3399cc; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #287a99; }
        #log { margin-top: 20px; padding: 10px; background: #222; color: #0f0; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="box">
    <h2>VocabMitra Premium Checkout</h2>
    <p>1. Login via Postman and paste your JWT Token here:</p>
    <input type="text" id="jwtToken" placeholder="eyJhbGciOiJIUzI1NiIsInR5c...">

    <p>2. Select Plan:</p>
    <select id="durationMonths">
        <option value="1">1 Month (₹129)</option>
        <option value="2">2 Months (₹248)</option>
        <option value="3">3 Months (₹357)</option>
    </select>

    <button onclick="startPayment()">Pay with Razorpay</button>
</div>

<div id="log">Waiting to start...</div>

<script>
    function logMsg(msg) {
        document.getElementById("log").innerText += "\n" + msg;
    }

    async function startPayment() {
        const token = document.getElementById('jwtToken').value;
        const duration = document.getElementById('durationMonths').value;
        if (!token) return alert("Please paste your JWT Token first!");

        logMsg("1. Calling backend /subscription/create-order...");

        try {
            // STEP 1: Ask Backend to create the order
            const orderResponse = await fetch('/subscription/create-order', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ durationMonths: parseInt(duration) })
            });

            const orderData = await orderResponse.json();
            if (!orderResponse.ok) throw new Error(orderData.error || "Order creation failed");
            logMsg("Order Created! ID: " + orderData.razorpayOrderId);

            // STEP 2: Configure Razorpay Popup
            var options = {
                "key": "rzp_test_SWHQq5Kq6JrLdD", // <-- REPLACE THIS!
                "amount": orderData.amount,
                "currency": orderData.currency,
                "name": "VocabMitra",
                "description": "Premium Subscription (" + duration + " Months)",
                "order_id": orderData.razorpayOrderId,
                "handler": async function (response) {
                    logMsg("2. Payment Success! Received signature from Razorpay.");
                    logMsg("Payment ID: " + response.razorpay_payment_id);

                    // STEP 3: Send success details to backend for verification
                    logMsg("3. Sending to /subscription/verify-payment...");

                    const verifyRes = await fetch('/subscription/verify-payment', {
                        method: 'POST',
                        headers: {
                            // Important: Assuming your verify-payment does NOT need auth,
                            // but if it does, add the Authorization header here too!
                            'Authorization': 'Bearer ' + token,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            razorpayOrderId: response.razorpay_order_id,
                            razorpayPaymentId: response.razorpay_payment_id,
                            razorpaySignature: response.razorpay_signature
                        })
                    });

                    const verifyData = await verifyRes.json();
                    if (verifyRes.ok) {
                        logMsg("✅ BACKEND VERIFIED: " + verifyData.message);
                        logMsg("Check your database! The user role should now be SUBSCRIBED_USER.");
                    } else {
                        logMsg("❌ BACKEND REJECTED: " + verifyData.error);
                    }
                },
                "theme": { "color": "#3399cc" }
            };

            var rzp1 = new Razorpay(options);
            rzp1.open();

        } catch (error) {
            logMsg("Error: " + error.message);
        }
    }
</script>
</body>
</html>
